[package]
name = "workspace"
version = "0.1.0"
edition = "2024"

[dependencies]
hex = "0.4.3"
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.25.0", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3.27.0"
