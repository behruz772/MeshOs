[lib]
crate-type = ["rlib", "cdylib"]

[package]
name = "mesh-core"
version = "0.1.0"
edition = "2024"

[dependencies]
jni = "0.21"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
ed25519-dalek = "3.0.0"
getrandom = { version = "0.4.3", features = ["std"] }
hkdf = "0.13.0"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1.25.0", features = ["serde", "v4"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
